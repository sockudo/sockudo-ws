name: Publish to crates.io

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  # Keep cached CI artifacts portable across hosted runner CPUs.
  RUSTFLAGS: ""

jobs:
  autobahn:
    name: Autobahn
    uses: ./.github/workflows/autobahn.yml

  publish:
    name: Publish
    needs: autobahn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Verify build
        run: cargo build --locked --release --all-features

      - name: Run tests
        run: cargo nextest run --locked --all-features --profile ci

      - name: Run doctests
        run: cargo test --locked --doc --all-features

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
