name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  # Keep cached CI artifacts portable across hosted runner CPUs.
  RUSTFLAGS: ""

jobs:
  autobahn:
    name: Autobahn
    uses: ./.github/workflows/autobahn.yml

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            runner: ubuntu-latest
            args: ""
          - name: arm64
            runner: ubuntu-24.04-arm
            args: ""
          - name: all-features
            runner: ubuntu-latest
            args: --all-features
          - name: tokio
            runner: ubuntu-latest
            args: --no-default-features --features tokio-runtime,http2,http3
          - name: compio
            runner: ubuntu-latest
            args: --no-default-features --features compio-runtime,http2,http3
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --locked ${{ matrix.args }} --profile ci

      - name: Run doctests
        if: matrix.name == 'all-features'
        run: cargo test --locked --doc --all-features

      - name: Clippy
        if: matrix.name == 'all-features' || matrix.name == 'default' || matrix.name == 'arm64'
        run: cargo clippy --locked ${{ matrix.args }} --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
