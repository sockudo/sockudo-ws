name: Autobahn

on:
  workflow_call:
  workflow_dispatch:

env:
  # Keep cached CI artifacts portable across hosted runner CPUs.
  RUSTFLAGS: ""

jobs:
  autobahn:
    name: WebSocket conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            autobahn-testsuite-rs -> target

      - name: Run full Autobahn suite
        run: make -C autobahn test

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-reports
          path: autobahn/reports/
          retention-days: 14
