[package]
name = "autobahn-testsuite-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Native asynchronous WebSocket conformance test runner"
exclude = ["upstream/**", "reports/**", "tools/reference/**"]

[lib]
name = "autobahn_testsuite"

[[bin]]
name = "wstest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
httparse = "1"
rand = "0.9"
rmp-serde = "1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"

[[bench]]
name = "codec"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
perf = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
